name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ── Backend Tests (matrix across Python versions) ──────────
  test:
    name: "Test — Python ${{ matrix.python }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: ${{ runner.os }}-pip-${{ matrix.python }}-

      - name: Install system deps (YARA + ssdeep)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libyara-dev libfuzzy-dev

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev,yara]"
          pip install ssdeep 2>/dev/null || echo "[CI] ssdeep skipped (build incompatible)"
          pip install py-tlsh 2>/dev/null || echo "[CI] py-tlsh skipped"

      - name: Verify imports
        run: |
          python -c "import anteumbra; print('Version:', anteumbra.__version__)"
          python -c "from anteumbra.infrastructure.config.version import get_version; print('get_version():', get_version())"

      - name: Run tests
        run: |
          python -m pytest tests/ \
            --ignore=tests/e2e_ui \
            -v \
            --tb=short \
            -p no:warnings
        env:
          ANTEUMBRA_TOOL_MODE: "true"
          CI: "true"

  # ── UI Tests (Playwright, single Python version) ───────────
  ui-tests:
    name: "UI Tests — Playwright"
    runs-on: ubuntu-latest
    needs: []  # run in parallel with test job
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libyara-dev libfuzzy-dev

      - name: Install Python deps + Playwright
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev,yara]"
          pip install ssdeep 2>/dev/null || echo "[CI] ssdeep skipped"
          python -m playwright install chromium --with-deps

      - name: Run UI tests
        run: |
          python -m pytest tests/e2e_ui/ -v --tb=short -p no:warnings
        env:
          ANTEUMBRA_TOOL_MODE: "true"

  # ── Package Build Check ───────────────────────────────────
  build:
    name: "Build Check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Verify wheel
        run: |
          pip install dist/*.whl
          python -c "import anteumbra; print('Installed version:', anteumbra.__version__)"
          anteumbra --version 2>&1 || true

  # ── Docker Build Check ────────────────────────────────────
  docker:
    name: "Docker Build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t anteumbra:ci .

      - name: Smoke test
        run: |
          docker run --rm -d --name anteumbra-ci -p 8080:8080 anteumbra:ci
          sleep 3
          curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/api/v1/health || true
          docker stop anteumbra-ci || true
