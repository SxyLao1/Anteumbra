[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anteumbra"
dynamic = ["version"]
description = "Anteumbra - Web Perimeter Threat Intelligence. Passive detection, semi-active response, attacker profiling."
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "SxyLao1"}]
keywords = ["webshell", "security", "detection", "yara", "waf", "forensics", "threat-intel", "profiling"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Flask",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Internet :: Log Analysis",
]
readme = "README.md"

dependencies = [
    "flask>=2.3.3,<3.0.0",
    "flask-wtf>=1.2.1",
    "flask-session>=0.8.0,<1.0.0",
    "cachelib>=0.13.0",
    "flask-babel>=3.1.0",
    "wtforms>=3.1.2",
    "watchdog>=3.0.0",
    "click>=8.1.0",
    "requests>=2.32.3",
    "psutil>=5.9.8",
    "tomli>=2.0.1",
    "tomli-w>=1.0.0",
    "colorama>=0.4.6",
    "urllib3>=2.2.2",
    "python-dotenv>=1.0.0",
    "waitress>=3.0.0,<4.0.0",
    "yara-python>=4.5.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov", "playwright>=1.40", "ruff>=0.12.0,<1.0.0"]
yara = []
full = ["ssdeep", "py-tlsh"]

[project.scripts]
anteumbra = "anteumbra.__main__:main"

[project.urls]
Homepage = "https://github.com/SxyLao1/Anteumbra"
Repository = "https://github.com/SxyLao1/Anteumbra.git"
Issues = "https://github.com/SxyLao1/Anteumbra/issues"

[tool.setuptools.dynamic]
version = {attr = "anteumbra.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
anteumbra = [
    "config.toml",
    "rules/webshell/*.yar",
    "translations/**/*.mo",
    "translations/**/*.po",
    "interfaces/web/templates/**/*.html",
    "interfaces/web/static/*.svg",
    "interfaces/web/static/css/*.css",
    "interfaces/web/static/js/*.js",
    "interfaces/web/static/js/modules/*.js",
    "plugins/**/*.py",
]

[tool.setuptools.exclude-package-data]
anteumbra = [
    "**/__pycache__/*",
    "**/*.pyc",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["build", "dist", "data", "logs", "pentest-work", "temp"]

[tool.ruff.lint]
# Enforce fatal syntax and undefined-name defects project-wide. Broader
# style cleanup is a touch-on-change rule until the legacy backlog is retired.
select = ["E9", "F63", "F7", "F82"]

[tool.coverage.report]
# Stage 0 baseline: non-browser suite measured 61% on 2026-08-01.
fail_under = 60
precision = 0
