<!DOCTYPE html>
<html>
<head>
  <title>{{ _("Anteumbra :: Secure Login") }}</title>
  <meta charset="utf-8">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/vars.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/animations.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
  <script src="{{ url_for('static', filename='js/cyber-effects.js') }}" defer></script>
  <meta name="anteumbra-version" content="{{ anteumbra_version }}" hidden>
</head>
<body class="login-page">
  <div class="login-box animate-fade-in-up">
    <div class="login-header">
      <div class="login-brand">{{ _("ANTEUMBRA") }}</div>
      <div class="login-subtitle">{{ _("WebShell Detection System") }}</div>
    </div>

    {% if error %}
    <div class="login-error">
      <span>⚠</span>
      <span>{{ error }}</span>
    </div>
    {% endif %}

    <form class="login-form" method="POST" action="{{ url_for('admin_totp.login_totp' if totp_challenge else 'admin.login') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      {% if totp_challenge %}
      <div class="form-group">
        <label class="form-label">{{ _('Administrator') }}</label>
        <input type="text" class="form-input" value="{{ username }}" readonly>
      </div>
      <div class="form-group">
        <label class="form-label">{{ _('Authenticator or recovery code') }}</label>
        <input type="text" name="totp_code" class="form-input" inputmode="numeric" autocomplete="one-time-code" placeholder="{{ _('6-digit code or recovery code') }}" required autofocus>
      </div>
      <button type="submit" class="login-btn">{{ _('VERIFY SECOND FACTOR') }}</button>
      {% else %}
      <div class="form-group">
        <label class="form-label">{{ _('Username') }}</label>
        <input type="text" name="username" class="form-input" placeholder="{{ _("admin") }}" required autofocus>
      </div>
      <div class="form-group">
        <label class="form-label">{{ _("Password") }}</label>
        <input type="password" name="password" class="form-input" placeholder="••••••••" required>
      </div>
      <button type="submit" class="login-btn">{{ _("AUTHENTICATE") }}</button>
      {% endif %}
    </form>

    <div class="login-footer">
      {{ _("Anteumbra Security Platform // MIT License // Cross-Platform") }}
    </div>
  </div>
</body>
</html>
