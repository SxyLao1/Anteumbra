<section class="threats-view" data-threats-tabs>
  <div class="threats-tabs" role="tablist">
    <button class="threats-tab active" type="button" role="tab" data-action="dashboard.threat-tab" data-tab="active">{{ _('Active Threats') }}</button>
    <button class="threats-tab" type="button" role="tab" data-action="dashboard.threat-tab" data-tab="quarantine">{{ _('Quarantine') }}</button>
    <button class="threats-tab" type="button" role="tab" data-action="dashboard.threat-tab" data-tab="audit">{{ _('Audit Log') }}</button>
    <button class="threats-tab" type="button" role="tab" data-action="dashboard.threat-tab" data-tab="clusters">{{ _('File Clusters') }}</button>
  </div>
  <div id="threats-tab-active" class="threats-tab-content"><div id="threats-active-container" data-threat-target><div class="empty-state"><div class="spinner"></div><p>{{ _('Loading records...') }}</p></div></div></div>
  <div id="threats-tab-quarantine" class="threats-tab-content" hidden><div id="threats-quarantine-container" data-threat-target><div class="empty-state"><div class="spinner"></div><p>{{ _('Loading quarantine...') }}</p></div></div></div>
  <div id="threats-tab-audit" class="threats-tab-content" hidden><div id="threats-audit-container" data-threat-target><div class="empty-state"><div class="spinner"></div><p>{{ _('Loading audit log...') }}</p></div></div></div>
  <div id="threats-tab-clusters" class="threats-tab-content" hidden><div id="threats-clusters-container" data-threat-target><div class="empty-state"><div class="spinner"></div><p>{{ _('Loading clusters...') }}</p></div></div></div>
</section>
