<section class="settings-grid">
  <section class="card"><div class="card-header">{{ _('ACCOUNT') }}</div><div class="card-body" hx-get="/admin/account" hx-trigger="load" hx-swap="innerHTML"><div class="empty-state"><div class="spinner"></div><p>{{ _('Loading...') }}</p></div></div></section>
  <section class="card"><div class="card-header">{{ _('SYSTEM') }}</div><div class="card-body settings-actions"><button class="btn btn-ghost btn-sm" type="button" data-action="settings.system-open" data-system-type="registry">{{ _('Registry Status') }}</button><button class="btn btn-ghost btn-sm" type="button" data-action="settings.system-open" data-system-type="wal">{{ _('WAL Management') }}</button><button class="btn btn-ghost btn-sm" type="button" data-action="settings.system-open" data-system-type="session">{{ _('Session Management') }}</button><button class="btn btn-ghost btn-sm" type="button" data-action="settings.system-open" data-system-type="config">{{ _('Config Reload') }}</button></div></section>
  <section class="card"><div class="card-header">{{ _('EXPORT & SIEM') }}</div><div class="card-body" id="settings-siem" hx-get="/admin/settings/siem-status" hx-trigger="load" hx-swap="innerHTML"><div class="empty-state"><div class="spinner"></div></div></div></section>
  <section class="card"><div class="card-header">{{ _('STORAGE') }}</div><div class="card-body" id="settings-storage" hx-get="/admin/settings/storage-status" hx-trigger="load" hx-swap="innerHTML"><div class="empty-state"><div class="spinner"></div></div></div></section>
  <section class="card settings-grid--wide"><div class="card-header">{{ _('PLUGINS') }}</div><div class="card-body" id="settings-plugins" hx-get="/admin/settings/plugin-status" hx-trigger="load" hx-swap="innerHTML"><div class="empty-state"><div class="spinner"></div></div></div></section>
  <section class="card settings-grid--wide"><div class="card-header">{{ _('CONFIG EDITOR') }}</div><div class="card-body" id="settings-config" hx-get="/admin/settings/config/editor" hx-trigger="load" hx-swap="innerHTML"><div class="empty-state"><div class="spinner"></div><p>{{ _('Loading config editor...') }}</p></div></div></section>
  <section class="card settings-grid--wide"><div class="card-header">{{ _('NOTIFICATIONS') }}</div><div class="card-body" id="settings-notify" hx-get="/admin/settings/notifications" hx-trigger="load" hx-swap="innerHTML"><div class="empty-state"><div class="spinner"></div></div></div></section>
</section>
<div id="system-modal" class="modal-overlay modal-overlay--front" aria-hidden="true" data-action="core.backdrop-close"><div class="modal-box modal-box--detail" role="dialog" aria-modal="true"><div class="modal-header"><h3 id="system-modal-title">{{ _('System') }}</h3><span id="system-modal-actions"></span><button class="btn btn-ghost btn-sm" type="button" data-action="core.modal-hide" data-modal="system-modal">{{ _('Close') }}</button></div><div class="modal-body" id="system-modal-body"><div class="empty-state"><div class="spinner"></div><p>{{ _('Loading...') }}</p></div></div></div></div>
